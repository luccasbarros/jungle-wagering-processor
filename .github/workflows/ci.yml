name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + unit + integration (real Postgres and LocalStack SQS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Start Postgres and LocalStack
        run: docker compose up -d --wait postgres localstack
      - name: Install dependencies (lockfile only, no lifecycle scripts)
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

  e2e:
    name: e2e (3 replicas behind nginx, SIGKILL and graceful restart)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (lockfile only, no lifecycle scripts)
        run: bun install --frozen-lockfile
      # Builds the image, starts migrate + 3 app replicas + nginx with --wait, then runs the suite against localhost:3000.
      - run: bun run test:e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
