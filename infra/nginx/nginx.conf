events {}

http {
  upstream app {
    zone app 64k;
    # Docker's embedded DNS answers one A record per replica; `resolve` re-reads it, so a restarted replica with a new address is picked up without a reload.
    resolver 127.0.0.11 valid=2s;
    server app:3000 resolve max_fails=1 fail_timeout=2s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      # Default: a POST that failed on a dead replica is not replayed by the proxy; the client retries with the same Idempotency-Key.
      proxy_next_upstream error timeout;
    }
  }
}
